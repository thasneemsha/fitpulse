version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    ports:
      - "5173:80"  # Maps local port 5173 to Nginx port 80 in the container
    depends_on:
      - backend
    restart: always
